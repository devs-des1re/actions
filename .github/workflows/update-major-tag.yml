name: update-major-tag

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Move major tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Skipping non-stable tag: $TAG"
            exit 0
          fi
          MAJOR="${TAG%%.*}"
          git tag -f "$MAJOR" "${TAG}^{commit}"
          git push -f origin "$MAJOR"
          echo "Moved \`$MAJOR\` to \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
